name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply contact details and footer icons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='"email": "paintersandtextures@gmail.com",\n      "description":'
          new='"email": "paintersandtextures@gmail.com",\n      "address": {\n        "@type": "PostalAddress",\n        "streetAddress": "84/2, 4th Cross, LG Ramanna Layout",\n        "addressLocality": "Rajarajeshwari Nagar, Laggere",\n        "addressRegion": "Karnataka",\n        "postalCode": "560058",\n        "addressCountry": "IN"\n      },\n      "description":'
          if old in s and '"streetAddress": "84/2, 4th Cross, LG Ramanna Layout"' not in s: s=s.replace(old,new,1)
          marker='<div class="footer-bottom"><span>Painting · Textures · Wood finishes · Wall coverings</span>'
          icons='<div class="footer-contact-row"><a class="footer-address" href="https://www.google.com/maps/search/?api=1&query=84%2F2%2C%204th%20Cross%2C%20LG%20Ramanna%20Layout%2C%20Rajarajeshwari%20Nagar%2C%20Laggere%2C%20Bengaluru%20560058" target="_blank" rel="noopener" aria-label="Open Painters and Textures location in Google Maps"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.1 7-12A7 7 0 0 0 5 9c0 5.9 7 12 7 12Z"/><circle cx="12" cy="9" r="2.4"/></svg><span>84/2, 4th Cross, LG Ramanna Layout, Rajarajeshwari Nagar, Laggere, Bengaluru 560058</span></a><div class="footer-socials" aria-label="Contact links"><a href="mailto:paintersandtextures@gmail.com" aria-label="Email Painters and Textures" title="Email"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg></a><a href="https://wa.me/917026193396" target="_blank" rel="noopener" aria-label="WhatsApp Painters and Textures" title="WhatsApp"><svg viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.6-4A8 8 0 1 1 20 11.5Z"/><path d="M8.2 8.2c.3-.4.7-.4 1-.1l1.2 1.1c.3.3.3.6.1.9l-.5.7c.6 1 1.4 1.7 2.5 2.2l.6-.5c.3-.2.6-.2.9 0l1.2 1c.3.3.3.7 0 1-.5.6-1.1.8-1.8.6-3.2-.9-5.6-3.3-6.5-6.4-.2-.6 0-1.1.5-1.5Z"/></svg></a><a href="tel:+917026193396" aria-label="Call Painters and Textures" title="Phone"><svg viewBox="0 0 24 24"><path d="M7.2 3.5 5.4 5.1c-.7.6-.8 1.6-.4 2.4 2.2 4.7 5.8 8.3 10.5 10.5.8.4 1.8.3 2.4-.4l1.6-1.8c.5-.6.5-1.5-.1-2l-2.3-1.9c-.6-.5-1.4-.5-2 .1l-.8.8a13.7 13.7 0 0 1-3.9-3.9l.8-.8c.6-.6.6-1.4.1-2L9.2 3.6c-.5-.6-1.4-.6-2-.1Z"/></svg></a><a href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="Painters and Textures on Instagram" title="Instagram"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="12" cy="12" r="4"/><circle cx="17.4" cy="6.8" r="1" fill="currentColor" stroke="none"/></svg></a></div></div>'+marker
          if marker in s and 'class="footer-contact-row"' not in s: s=s.replace(marker,icons,1)
          css='<style>.footer-contact-row{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:22px;padding:14px 0;border-top:1px solid rgba(255,255,255,.09);border-bottom:1px solid rgba(255,255,255,.09)}.footer-address{display:flex;align-items:center;gap:10px;max-width:760px;color:#c9c9c0;font-size:10px;line-height:1.5}.footer-address svg{width:18px;height:18px;flex:none;fill:none;stroke:#dca083;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.footer-socials{display:flex;align-items:center;gap:8px;flex:none}.footer-socials a{width:34px;height:34px;border:1px solid rgba(220,160,131,.38);display:flex;align-items:center;justify-content:center;color:#dca083;transition:.2s}.footer-socials a:hover{background:#dca083;color:#2d3028;border-color:#dca083;transform:translateY(-2px)}.footer-socials svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}@media(max-width:760px){.footer-contact-row{align-items:flex-start;flex-direction:column}.footer-address{max-width:none}.footer-socials{width:100%}}</style>'
          if 'footer-contact-row' in s and 'footer-socials svg' not in s: s=s.replace('</head>',css+'</head>',1)
          p.write_text(s)
          PY
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply contact details and footer icons"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
