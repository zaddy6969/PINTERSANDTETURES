name: Fix header scrolling

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix sticky header
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<style>/* Header scroll fix */'
          if marker not in s:
              s += '\n<style>/* Header scroll fix */\n.premium-nav{position:sticky!important;top:0!important;z-index:1000!important;}\n@media(max-width:760px){.premium-nav nav{top:74px;} }\n</style>\n'
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix sticky header scrolling"
          git push
