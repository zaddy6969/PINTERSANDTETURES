name: One-time room enquiry label update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace enquiry categories
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<option>Interior</option><option>Exterior Painting</option><option>Wood solution</option><option>Textuer</option><option>Wall Papper</option><option>Painting &amp; texture work</option><option>Other / not sure yet</option>'
          new = '<option>Living room</option><option>Bedroom</option><option>Dining</option><option>Workspaces</option><option>Other / not sure yet</option>'
          if old not in s:
              raise SystemExit('Expected enquiry options were not found')
          s = s.replace(old, new, 1)
          s = s.replace("service:'Interior',kind:'image'", "service:label,kind:'image'")
          s = s.replace("service:'Interior',kind:'image'", "service:label,kind:'image'")
          p.write_text(s, encoding='utf-8')

      - name: Commit live source change and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/update-room-enquiry-labels.yml
          git commit -m "Replace service enquiry labels with room categories"
          git push
